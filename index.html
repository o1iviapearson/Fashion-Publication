<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Publications</title>
    <link rel="stylesheet" href="styles.css">
</head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barriecito&family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Micro+5+Charted&family=Molle:ital@1&family=Rubik+Distressed&family=Rubik+Vinyl&family=Snowburst+One&family=Stalinist+One&display=swap" rel="stylesheet">

<body>

  <header class="title-carousel">

    <div class="title-track">

        <h1 class="micro-5-charted-regular">
            Fashion Publications        
        </h1>

        <h1 class="micro-5-charted-regular">
            Fashion Publications         
        </h1>

        <h1 class="micro-5-charted-regular">
            Fashion Publications         
        </h1>

        <h1 class="micro-5-charted-regular">
            Fashion Publications      
        </h1>

    </div>

</header>

    <main>

        <!-- SEARCH -->
        <section class="search-area">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search publications..."
            >
        </section>

        <!-- TYPE FILTER -->
       <section class="filters">

    <h2>Publication Type</h2>

    <div class="filter-buttons">

        <button class="filter typeFilter selected" data-type="all">
            All
        </button>

        <button class="filter typeFilter" data-type="magazine">
            Magazine
        </button>

        <button class="filter typeFilter" data-type="digital">
            Digital
        </button>

        <button class="filter typeFilter" data-type="social">
            Social
        </button>

        <button class="filter typeFilter" data-type="journal">
            Journal
        </button>

        <button class="filter typeFilter" data-type="trade">
            Trade
        </button>

    </div>

</section>

        <!-- FOCUS FILTER -->
        <section class="filters">
            <h2>Main Focus</h2>

            <ul>
                <li data-focus="all" class="filter focusFilter selected">All</li>
                <li data-focus="fashion" class="filter focusFilter">Fashion</li>
                <li data-focus="art" class="filter focusFilter">Art</li>
                <li data-focus="culture" class="filter focusFilter">Culture</li>
                <li data-focus="business" class="filter focusFilter">Business</li>
                <li data-focus="streetwear" class="filter focusFilter">Streetwear</li>
                <li data-focus="luxury" class="filter focusFilter">Luxury</li>
            </ul>
        </section>

        <!-- PUBLICATIONS WILL BE GENERATED HERE -->
        <section id="publications"></section>

    </main>

    <script src="script.js"></script>



</body>
</html>
