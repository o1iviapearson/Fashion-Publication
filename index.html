<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ice Cream Collage</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="controls">

  <div class="control-row">
    <label for="title-input">ice cream name</label>
    <input id="title-input" type="text" value="ice cream dream">
  </div>

  <div class="control-row">
    <label for="icecream-size">ice cream size</label>
    <input
      id="icecream-size"
      type="range"
      min="0.5"
      max="2"
      step="0.05"
      value="1"
    >
  </div>

  <div class="control-row">
    <label for="cherry-x">cherry x</label>
    <input
      id="cherry-x"
      type="range"
      min="-200"
      max="200"
      value="0"
    >


    <label for="cherry-y">cherry y</label>
    <input
      id="cherry-y"
      type="range"
      min="-200"
      max="200"
      value="-30"
    >
  </div>

  <div class="control-row">
    <label for="oreo-x">oreo x</label>
    <input
      id="oreo-x"
      type="range"
      min="-200"
      max="200"
      value="0"
    >

    <label for="oreo-y">oreo y</label>
    <input
      id="oreo-y"
      type="range"
      min="-200"
      max="200"
      value="0"
    >
  </div>

  <div class="control-row">
    <label for="oreo-size">oreo size</label>
    <input
      id="oreo-size"
      type="range"
      min="0.5"
      max="2"
      step="0.05"
      value="1"
    >
  </div>

  <div class="control-row">
    <label for="cone-size">cone size</label>
    <input
      id="cone-size"
      type="range"
      min="0.5"
      max="2"
      step="0.05"
      value="1"
    >
  </div>

</div>

<div class="collage">

  <img id="cone" src="Icone.png" alt="ice cream cone">

  <img id="icecream" src="icecream.png" alt="ice cream scoop">

  <img id="oreo" src="iOreo.png" alt="oreo">

  <img id="cherry" src="icherry.png" alt="cherry">

  <h1 id="word">ice cream dream</h1>

</div>

    <script src="script.js"></script>
  </body>
</html>
